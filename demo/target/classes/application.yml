spring:
  application:
    name: xfash-web-project
  # 数据库的相关配置
  datasource:
    url: jdbc:mysql://localhost:3306/xfash
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
#    mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
#   阿里云oss信息
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: fish-xfash
    region: cn-beijing
# JWT 配置
jwt:
  secret-key: XFsh@2026SecretKey!Secure#Powerful$Key%9876
  expiration: 43200000  # 12 小时（毫秒）